version: '3'

services:
  rest-server:
    image: trabalhodois:rest-server
    ports:
      - "8001:8001"
    container_name: rest_server
    build:
      context: ./rest

  soap-server:
    image: trabalhodois:soap-server
    ports:
      - "8002:8002"
    container_name: soap_server
    build:
      context: ./soap

  grpc-server:
    image: trabalhodois:grpc-server
    ports:
      - "8003:8003"
    container_name: grpc_server
    build:
      context: ./grpc

  graphql-server:
    image: trabalhodois:graphql-server
    ports:
      - "8004:8004"
    container_name: graphql_server
    build:
      context: ./graphql
    
  websocket_server:
    image: trabalhodois:websocket_server
    ports:
      - "8010:8010"
    container_name: websocket_server
    build:
      context: ./websocket_server

  rabbitmq:
    image: trabalhodois:rabbitmq
    ports:
      - 5672:5672
      - 15672:15672
    container_name: rabbitmq
    build:
      context: ./rabbitmq

  redis:
    image: trabalhodois:redis
    ports:
      - "6379:6379"
    container_name: redis
    build:
      context: ./redis
    